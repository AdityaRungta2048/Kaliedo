name: Build Android app

# Produces an installable .apk on EAS. Run it from the Actions tab; the download
# link appears in the run summary when the build finishes.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Sync shared code from the web app
        run: npm run sync

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        id: build
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait \
            --json > build.json
          url=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl)")
          {
            echo "### Kaleida Android build"
            echo ""
            echo "Download and install on your phone:"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
